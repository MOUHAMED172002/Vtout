server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Sécurité: Masquer la version de Nginx
    server_tokens off;

    # Sécurité: En-têtes HTTP essentiels
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: blob:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' https: wss:; frame-src 'self' https:; object-src 'none';" always;


    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Blocage des scans de vulnérabilités (Bots/Exploits)
    location ~* /(\.env|\.git|wp-admin|wp-login|xmlrpc|phpmyadmin|bin|config|setup\.php|install\.php|_ignition) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Optimisation: Compression Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript;
    gzip_disable "MSIE [1-6]\.";

    # Cache pour les assets statiques
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Gestion de l'application React (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Erreur 404 personnalisée (optionnel)
    error_page 404 /index.html;

    # Limite de taille pour les uploads
    client_max_body_size 10M;
}
